<h2>Our Vehicles</h2>
<div class="vehicle-grid">
  <div *ngFor="let vehicle of vehicles" class="vehicle-card">
    <img [src]="vehicle.imageUrl" alt="Image of {{vehicle.make}} {{vehicle.model}}">
    <div class="vehicle-info">
      <h3>{{ vehicle.make }} {{ vehicle.model }}</h3>
      <p>Year: {{ vehicle.year }}</p>
      <p>Price: {{ vehicle.price | currency:'USD' }}</p>
      <a routerLink="/vehicle/{{vehicle.id}}" class="details-button">View Details</a>
    </div>
  </div>
</div>
<p *ngIf="vehicles.length === 0">No vehicles currently available.</p>
